name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot-native/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Export Neon Drift for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Prepare export directory
        run: mkdir -p godot-native/build

      - name: Import project assets
        run: godot --headless --editor --path godot-native --quit

      - name: Export Windows executable
        run: godot --headless --path godot-native --export-release "Windows Desktop" godot-native/build/NeonDrift.exe

      - name: Package Windows build
        run: |
          cd godot-native/build
          zip -9 Neon-Drift-Windows.zip NeonDrift.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Drift-Windows
          path: godot-native/build/Neon-Drift-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Neon Drift Windows Build ${{ github.run_number }}
          body: |
            Automated Windows desktop build of Neon Drift.
            
            Download **Neon-Drift-Windows.zip**, extract it, and run **NeonDrift.exe**.
          files: godot-native/build/Neon-Drift-Windows.zip
          make_latest: true
