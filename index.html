<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090714">
<title>Neon Drift — Arcade Survival</title>
<style>
:root{color-scheme:dark;--bg:#090714;--panel:#151027;--purple:#a855f7;--cyan:#39e6ff;--pink:#ff4fd8;--muted:#aaa2c5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#21113f 0%,var(--bg) 58%);color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}
body{display:grid;place-items:center;padding:16px;overflow-x:hidden}
.shell{width:min(100%,980px);display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(20px,4vw,30px);text-shadow:0 0 18px #a855f7}
.brand span{color:var(--cyan)}
.pill{border:1px solid #5e4388;background:#160f29;border-radius:999px;padding:8px 13px;color:#d9cafa;font-size:12px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#120d21cc;border:1px solid #382653;border-radius:14px;padding:10px 14px;box-shadow:inset 0 0 18px #a855f70a}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.stat strong{font-size:clamp(18px,4vw,25px);font-variant-numeric:tabular-nums}
.game-wrap{position:relative;border:1px solid #7046a0;border-radius:20px;overflow:hidden;background:#070611;box-shadow:0 0 35px #8b35e533,0 0 90px #26d9ff12;touch-action:none}
canvas{display:block;width:100%;height:min(65vh,590px);min-height:360px;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080513c9;backdrop-filter:blur(7px);padding:22px;text-align:center}
.overlay.hidden{display:none}
.dialog{max-width:440px}
h1{font-size:clamp(32px,7vw,58px);line-height:.95;margin:0 0 12px;letter-spacing:-.05em}
h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 22px #39e6ff88}
.desc{color:#c3bad9;line-height:1.55;margin:0 auto 20px;max-width:360px}
button{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(100deg,#8b35e8,#4b9cff);color:white;font-weight:850;font-size:15px;cursor:pointer;box-shadow:0 7px 25px #8b35e855}
button:active{transform:translateY(1px) scale(.99)}
.hint{color:#aaa2c5;font-size:12px;margin-top:14px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#aaa2c5;font-size:12px}
.controls{display:flex;gap:8px}
.controls button{padding:9px 13px;font-size:12px;background:#1a1230;border:1px solid #523477;box-shadow:none}
.mobile-controls{display:none;justify-content:center;gap:18px;padding:4px}
.mobile-controls button{width:76px;height:54px;font-size:23px;border:1px solid #68418e;background:#1b1230}
@media(max-width:620px){body{padding:10px}.hud{gap:6px}.stat{padding:8px 10px}.game-wrap{border-radius:15px}canvas{height:58vh;min-height:330px}.bottom{font-size:11px}.mobile-controls{display:flex}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand">NEON <span>DRIFT</span></div><div class="pill">ARCADE SURVIVAL</div></header>
<section class="hud">
 <div class="stat"><small>Score</small><strong id="score">00000</strong></div>
 <div class="stat"><small>Best</small><strong id="best">00000</strong></div>
 <div class="stat"><small>Level</small><strong id="level">01</strong></div>
</section>
<div class="game-wrap">
 <canvas id="game" aria-label="Neon Drift game area"></canvas>
 <div class="overlay" id="overlay"><div class="dialog">
  <h1>NEON<br><em>DRIFT</em></h1>
  <p class="desc" id="message">Dodge the incoming neon blocks. Survive, collect the glowing cores, and beat your high score.</p>
  <button id="start">START GAME</button>
  <div class="hint">Desktop: A / D or ← / → &nbsp; • &nbsp; Mobile: drag or use buttons</div>
 </div></div>
</div>
<div class="mobile-controls"><button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button></div>
<div class="bottom"><span>One more run. You know you want to.</span><div class="controls"><button id="pause">PAUSE</button><button id="sound">SOUND: ON</button></div></div>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),levelEl=document.querySelector('#level');
const overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),startBtn=document.querySelector('#start');
let W=0,H=0,dpr=1,player,obstacles=[],cores=[],particles=[],stars=[],score=0,best=+(localStorage.getItem('neonDriftBest')||0),level=1,frame=0,running=false,paused=false,sound=true,audio;
let keys={left:false,right:false},pointer=null,last=0,spawn=0,coreSpawn=0;
bestEl.textContent=String(best).padStart(5,'0');
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*1.5}));if(!player)resetPlayer();else player.y=H-65}
function resetPlayer(){player={x:W/2,y:H-65,w:28,h:34,v:0};}
function beep(freq=440,duration=.07,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function start(){score=0;level=1;frame=0;spawn=0;coreSpawn=0;obstacles=[];cores=[];particles=[];resetPlayer();running=true;paused=false;overlay.classList.add('hidden');last=performance.now();beep(660,.12);requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonDriftBest',best);bestEl.textContent=String(best).padStart(5,'0');message.textContent=`You scored ${Math.floor(score).toLocaleString()}. Your best is ${best.toLocaleString()}. Ready to beat it?`;startBtn.textContent='PLAY AGAIN';overlay.classList.remove('hidden');beep(130,.35,'sawtooth')}
function togglePause(){if(!running)return;paused=!paused;document.querySelector('#pause').textContent=paused?'RESUME':'PAUSE';if(!paused){last=performance.now();requestAnimationFrame(loop)}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*20,color})}}
function rectHit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function drawShip(){ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=22;ctx.shadowColor='#39e6ff';ctx.fillStyle='#39e6ff';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(14,14);ctx.lineTo(0,8);ctx.lineTo(-14,14);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-3,4,0,Math.PI*2);ctx.fill();ctx.restore()}
function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/16.67,2);last=now;frame+=dt;score+=dt*(1+level*.13);level=1+Math.floor(score/900);let speed=(3.1+level*.35)*dt;
ctx.clearRect(0,0,W,H);ctx.fillStyle='#080612';ctx.fillRect(0,0,W,H);
for(const s of stars){s.y+=s.z*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle=`rgba(170,150,255,${.2+s.z*.3})`;ctx.fillRect(s.x,s.y,1.5*s.z,1.5*s.z)}
if(keys.left)player.v-=.75*dt;if(keys.right)player.v+=.75*dt;if(pointer!==null)player.x+=(pointer-player.x)*.22*dt;
player.v*=Math.pow(.82,dt);player.x+=player.v*dt;player.x=Math.max(18,Math.min(W-18,player.x));
spawn-=dt;if(spawn<=0){let w=24+Math.random()*35;obstacles.push({x:24+Math.random()*(W-48),y:-35,w,h:18+Math.random()*18,rot:(Math.random()-.5)*.3});spawn=Math.max(13,38-level*1.5)}
coreSpawn-=dt;if(coreSpawn<=0){cores.push({x:25+Math.random()*(W-50),y:-20,r:8});coreSpawn=105+Math.random()*75}
for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=speed*(.8+level*.025);ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.shadowBlur=18;ctx.shadowColor='#ff4fd8';ctx.fillStyle='#ff4fd8';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#ffd7fa';ctx.lineWidth=1;ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);ctx.restore();if(rectHit(player,o)){burst(player.x,player.y,'#ff4fd8',28);end();return}if(o.y>H+40)obstacles.splice(i,1)}
for(let i=cores.length-1;i>=0;i--){let c=cores[i];c.y+=speed*.8;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.shadowBlur=22;ctx.shadowColor='#ffe66d';ctx.fillStyle='#ffe66d';ctx.fill();ctx.shadowBlur=0;if(Math.hypot(c.x-player.x,c.y-player.y)<23){score+=150;burst(c.x,c.y,'#ffe66d',14);cores.splice(i,1);beep(880,.08)}else if(c.y>H+20)cores.splice(i,1)}
drawShip();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}
scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');levelEl.textContent=String(level).padStart(2,'0');requestAnimationFrame(loop)}
function setKey(k,v){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=v;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=v}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();setKey(e.key,true);if(e.key===' '&&running)togglePause()});
window.addEventListener('keyup',e=>setKey(e.key,false));
canvas.addEventListener('pointerdown',e=>{pointer=e.clientX-canvas.getBoundingClientRect().left;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(e.buttons)pointer=e.clientX-canvas.getBoundingClientRect().left});
canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);
function hold(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
hold('left','left');hold('right','right');
startBtn.addEventListener('click',start);document.querySelector('#pause').addEventListener('click',togglePause);
document.querySelector('#sound').addEventListener('click',e=>{sound=!sound;e.target.textContent='SOUND: '+(sound?'ON':'OFF');if(sound)beep()});
window.addEventListener('resize',resize);resize();
function idle(){if(running)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#080612';ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=s.z*.35;if(s.y>H)s.y=0;ctx.fillStyle=`rgba(170,150,255,${.2+s.z*.3})`;ctx.fillRect(s.x,s.y,1.5,1.5)}requestAnimationFrame(idle)}idle();
})();
</script>
</body>
</html>
